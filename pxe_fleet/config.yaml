name: Raspberry Pi PXE Fleet
version: "0.1.0"
slug: pxe_fleet
description: Replaceable network-boot OS generations with persistent app data, APT and Podman.
url: https://github.com/clammet/ha-pxe-fleet
stage: experimental
startup: services
boot: auto
init: false
arch:
  - aarch64
  - amd64
host_network: true
apparmor: false
full_access: true
privileged:
  - SYS_ADMIN
map:
  - addon_config:rw
options:
  config_file: fleet.yaml
schema:
  config_file: "match(^[a-zA-Z0-9_-]+\\.yaml$)"
