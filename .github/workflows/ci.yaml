name: Validate add-on
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML
      - run: PYTHONPATH=pxe_fleet python -m unittest discover -s tests -v
      - run: PYTHONPATH=pxe_fleet python -m fleet.server --config examples/fleet.yaml --validate
      - run: shellcheck pxe_fleet/assets/fleet-hook pxe_fleet/assets/fleet-overlay
      - run: docker build -t pxe-fleet:ci pxe_fleet
