name: Validate add-on
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y dosfstools mtools u-boot-tools
      - run: python -m pip install PyYAML
      - run: PYTHONPATH=pxe_fleet python -m unittest discover -s tests -v
      - run: PYTHONPATH=pxe_fleet python -m fleet.server --config examples/fleet.yaml --validate
      - run: shellcheck pxe_fleet/assets/fleet-hook pxe_fleet/assets/fleet-overlay pxe_fleet/assets/fleet-nfsmount pxe_fleet/assets/fleet-nfs boot-media/*.sh boot-media/scripts/*.sh pxe_fleet/bootloader/build-tools.sh
      - run: docker build -t pxe-fleet:ci pxe_fleet
